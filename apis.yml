name: Bellabeat
description: >-
  Bellabeat is a femtech and women's wellness technology company founded in 2014
  by Urska Srsen and Sandro Mur, headquartered in San Francisco, California. It
  designs health-tracking wearables and connected devices aimed at women,
  including the Leaf and Ivy wellness jewelry trackers, the Time hybrid
  smartwatch, and the Spring smart water bottle, paired with the Bellabeat mobile
  app that tracks activity, sleep, stress, meditation, menstrual cycle, and
  overall wellness. Bellabeat operates as a direct-to-consumer wellness brand;
  it does not currently publish a public developer API, so this profile captures
  company identity and network provenance rather than API artifacts. Added to the
  API Evangelist network as a Y Combinator portfolio lead and enriched here.
